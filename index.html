<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Link Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 20px;
            word-break: break-all;
            text-align: center;
        }
        #result a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        #result a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ఇమేజ్ లింక్ జనరేటర్</h2>
        
        <div class="form-group">
            <label for="imageName">పేరు (Name):</label>
            <input type="text" id="imageName" placeholder="ఇమేజ్ పేరు రాయండి">
        </div>

        <div class="form-group">
            <label for="imageFile">ఇమేజ్ అప్‌లోడ్ చేయండి:</label>
            <input type="file" id="imageFile" accept="image/*">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="originalSize">
            <label for="originalSize" style="margin-bottom: 0;">ఒరిజినల్ సైజ్ (Original Size)</label>
        </div>

        <button onclick="generateLink()">లింక్ జనరేట్ చేయి</button>

        <div id="result"></div>
    </div>

    <script>
        function generateLink() {
            const name = document.getElementById('imageName').value;
            const fileInput = document.getElementById('imageFile');
            const isOriginalSize = document.getElementById('originalSize').checked;
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("దయచేసి ఒక ఇమేజ్‌ని సెలెక్ట్ చేయండి!");
                return;
            }

            const file = fileInput.files[0];
            const blobUrl = URL.createObjectURL(file);

            // లింక్ మరియు సైజ్ ప్రాపర్టీలను సెట్ చేయడం
            let styleAttr = isOriginalSize ? 'style="max-width: none; height: auto;"' : 'style="max-width: 100%; height: auto;"';

            // ఒక కొత్త పేజీ లాగా ఓపెన్ అయ్యేలా లింక్ తయారు చేయడం
            resultDiv.innerHTML = `
                <p>మీ లింక్ సిద్ధంగా ఉంది (${name || 'Image'}):</p>
                <a href="${blobUrl}" target="_blank" id="generatedLink">ఇమేజ్ లింక్ ఇక్కడ ఉంది (క్లిక్ చేయండి)</a>
            `;
        }
    </script>

</body>
</html>
